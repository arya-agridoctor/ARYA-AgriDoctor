name: ARYA Main Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - "arya_main/**"
      - ".github/workflows/arya-main-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.2"
          channel: stable
          cache: true

      - name: Generate Android platform
        working-directory: arya_main
        run: flutter create --platforms=android .

      - name: Get dependencies
        working-directory: arya_main
        run: flutter pub get

      - name: Analyze
        working-directory: arya_main
        run: flutter analyze

      - name: Build APK
        working-directory: arya_main
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ARYA-Main-Android
          path: arya_main/build/app/outputs/flutter-apk/app-debug.apk
