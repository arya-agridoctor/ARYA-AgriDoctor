
name: ARYA Main Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "arya_main/**"
      - ".github/workflows/arya-main-build.yml"

permissions:
  contents: read

concurrency:
  group: arya-main-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Flutter source
        working-directory: arya_main
        run: |
          set -euo pipefail
          test -f pubspec.yaml || {
            echo "ERROR: pubspec.yaml not found."
            exit 1
          }
          test -f lib/main.dart || {
            echo "ERROR: lib/main.dart not found."
            exit 1
          }

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.2"
          channel: stable
          cache: true

      - name: Generate Android platform files
        working-directory: arya_main
        run: |
          set -euo pipefail
          if [ ! -f android/gradlew ]; then
            echo "Android Gradle wrapper missing; generating Android platform files."
            flutter create --platforms=android .
          fi

          if [ ! -f android/gradlew ]; then
            echo "ERROR: Android Gradle wrapper is still missing."
            exit 1
          fi

          chmod +x android/gradlew

      - name: Show Flutter version
        run: flutter --version

      - name: Get dependencies
        working-directory: arya_main
        run: flutter pub get

      - name: Analyze ARYA Main
        working-directory: arya_main
        run: flutter analyze lib --no-fatal-infos

      - name: Build APK
        working-directory: arya_main
        run: flutter build apk --debug

      - name: Verify APK
        working-directory: arya_main
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated successfully."
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ARYA-Main-Android
          path: arya_main/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
