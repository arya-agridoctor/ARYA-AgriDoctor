name: ARYA AgriDoctor Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "arya_main/**"
      - ".github/workflows/main.yml"
      - ".github/workflows/android.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: arya-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and Publish ARYA APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    defaults:
      run:
        working-directory: arya_main
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Flutter project
        run: |
          set -euo pipefail

          test -f pubspec.yaml || {
            echo "::error::arya_main/pubspec.yaml was not found"
            exit 1
          }

          test -f lib/main.dart || {
            echo "::error::arya_main/lib/main.dart was not found"
            exit 1
          }

          echo "Flutter project verified."

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.2"
          channel: stable
          cache: true

      - name: Show environment
        run: |
          set -euo pipefail
          flutter --version
          java -version
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Run ID: $GITHUB_RUN_ID"
          echo "Run number: $GITHUB_RUN_NUMBER"

      - name: Prepare Android platform
        run: |
          set -euo pipefail

          if [ ! -f android/gradlew ]; then
            flutter create \
              --platforms=android \
              --project-name arya_main \
              .
          fi

          test -f android/gradlew || {
            echo "::error::Android Gradle wrapper is missing"
            exit 1
          }

          chmod +x android/gradlew

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          test -f "$MANIFEST" || {
            echo "::error::AndroidManifest.xml is missing"
            exit 1
          }

          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i \
              '/<manifest[^>]*>/a\    <uses-permission android:name="android.permission.INTERNET" />' \
              "$MANIFEST"
          fi

          grep -q 'android.permission.INTERNET' "$MANIFEST" || {
            echo "::error::Internet permission is missing"
            exit 1
          }

          echo "Android platform is ready."

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Flutter application
        run: flutter analyze lib --no-pub --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify and identify APK
        id: verify_apk
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::Release APK is missing or empty"
            exit 1
          fi

          echo "APK_PATH=arya_main/$APK" >> "$GITHUB_ENV"
          echo "APK_SIZE=$(stat -c '%s' "$APK")" >> "$GITHUB_ENV"
          echo "APK_SHA256=$(sha256sum "$APK" | cut -d ' ' -f 1)" >> "$GITHUB_ENV"

          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK artifact
        id: upload_apk
        uses: actions/upload-artifact@v4
        with:
          name: ARYA-AgriDoctor-APK-${{ github.run_number }}
          path: arya_main/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Verify uploaded artifact
        if: success()
        env:
          ARTIFACT_ID: ${{ steps.upload_apk.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload_apk.outputs.artifact-url }}
        run: |
          set -euo pipefail

          if [ -z "$ARTIFACT_ID" ]; then
            echo "::error::GitHub did not return an artifact ID"
            exit 1
          fi

          echo "APK upload completed successfully."
          echo "Artifact ID: $ARTIFACT_ID"
          echo "Artifact URL: $ARTIFACT_URL"
          echo "APK size: $APK_SIZE bytes"
          echo "APK SHA-256: $APK_SHA256"

      - name: Report download information
        if: always()
        env:
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          JOB_STATUS: ${{ job.status }}
        working-directory: .
        run: |
          {
            echo "## ARYA AgriDoctor APK"
            echo ""
            echo "- Build status: \`$JOB_STATUS\`"
            echo "- Run number: \`$RUN_NUMBER\`"
            echo "- Run ID: \`$RUN_ID\`"
            echo ""
            echo "Open the workflow run and find the Artifacts section."
            echo "Download the APK artifact ZIP and extract app-release.apk."
            echo ""
            echo "Run URL:"
            echo "https://github.com/$REPOSITORY/actions/runs/$RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"
